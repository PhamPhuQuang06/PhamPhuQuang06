name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Tự động chạy vào lúc 00:00 hàng ngày
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Thẻ 1: Thống kê chung (Stats Card)
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Thẻ 1: Thống kê chung (Thêm theme=radical để đổi màu tối rực rỡ)
          options: username=${{ github.repository_owner }}&show_icons=true&locale=vi&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Thẻ 2: Ngôn ngữ lập trình hay dùng (Top Languages Card)
      - name: Generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # Thẻ 2: Ngôn ngữ (Thêm theme=radical và show_icons=true)
          options: username=${{ github.repository_owner }}&layout=compact&locale=vi&theme=radical&show_icons=true
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Tự động lưu ảnh vào kho lưu trữ
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
